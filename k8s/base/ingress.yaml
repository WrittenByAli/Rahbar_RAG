apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: rahbar
  namespace: rahbar
spec:
  ingressClassName: nginx
  rules:
    - host: rahbar.local
      http:
        paths:
          # /api/* goes to the api Service UNCHANGED. The API router is mounted at
          # prefix="/api" (api/app/routes/ask.py), so the prefix must survive the
          # Ingress. The previous rewrite-target: /$2 stripped /api, turning
          # /api/ask into /ask, and the UI got 404s. Prefix routing forwards the
          # full path and, by longest-prefix match, still beats the "/" rule for /api/*.
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: api
                port:
                  number: 80
          - path: /
            pathType: Prefix
            backend:
              service:
                name: ui
                port:
                  number: 80
