apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
patches:
  - patch: |-
      - op: replace
        path: /data/RETRIEVER
        value: stub
      - op: replace
        path: /data/LLM_PROVIDER
        value: stub
      - op: replace
        path: /data/EMBED_MODEL
        value: dummy-768
    target:
      kind: ConfigMap
      name: rahbar-config
