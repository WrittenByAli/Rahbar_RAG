name: CI

on:
  push:
    branches: [dev]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff mypy
      - run: ruff check api/ indexer/ eval/
      - run: mypy api/app/ --ignore-missing-imports

  test:
    runs-on: ubuntu-latest
    needs: lint
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r api/requirements.txt -r indexer/requirements.txt pytest
      - run: pytest api/tests/ indexer/tests/ -v

  build:
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t rahbar-api:${{ github.sha }} -f api/Dockerfile api/
      - run: docker build -t rahbar-indexer:${{ github.sha }} -f indexer/Dockerfile indexer/
      - run: docker build -t rahbar-ui:${{ github.sha }} -f ui/Dockerfile .

  scan:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t rahbar-api:${{ github.sha }} -f api/Dockerfile api/
      - name: Trivy scan API
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: rahbar-api:${{ github.sha }}
          severity: CRITICAL,HIGH
          exit-code: "0"

  kubeconform:
    runs-on: ubuntu-latest
    needs: lint
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Install kubeconform
        run: |
          curl -sL https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz | tar xz
          sudo mv kubeconform /usr/local/bin/
      - run: kubectl kustomize k8s/overlays/dev/ | kubeconform -strict -summary

  e2e:
    runs-on: ubuntu-latest
    needs: [build, kubeconform]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Create kind cluster
        uses: helm/kind-action@v1.10.0
      - name: Build and load images
        run: |
          docker build -t rahbar-api:${{ github.sha }} -f api/Dockerfile api/
          docker build -t rahbar-indexer:${{ github.sha }} -f indexer/Dockerfile indexer/
          docker build -t rahbar-ui:${{ github.sha }} -f ui/Dockerfile .
          kind load docker-image rahbar-api:${{ github.sha }} rahbar-indexer:${{ github.sha }} rahbar-ui:${{ github.sha }}
      - name: Deploy to kind
        run: |
          kubectl kustomize k8s/overlays/dev/ | sed "s|rahbar-api:dev|rahbar-api:${{ github.sha }}|g; s|rahbar-indexer:dev|rahbar-indexer:${{ github.sha }}|g; s|rahbar-ui:dev|rahbar-ui:${{ github.sha }}|g" | kubectl apply -f -
          kubectl create secret generic rahbar-secret -n rahbar --from-literal=LLM_API_KEY=unused || true
          kubectl wait --for=condition=available deployment/api -n rahbar --timeout=120s || true
      - name: Run indexer with fixtures
        run: |
          kubectl create job indexer-e2e --from=cronjob/reindex -n rahbar || true
          kubectl wait --for=condition=complete job/indexer-e2e -n rahbar --timeout=120s || true
      - name: Run eval
        run: |
          pip install httpx pyyaml
          API_URL=$(kubectl get svc api -n rahbar -o jsonpath='{.spec.clusterIP}')
          python eval/run_eval.py --api http://$API_URL --golden eval/fixtures/golden.fixture.yaml || true
