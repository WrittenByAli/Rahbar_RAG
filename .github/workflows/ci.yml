name: CI

on:
  push:
    branches: [dev]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff mypy
      - run: ruff check api/ indexer/ eval/
      - run: mypy api/app/ --ignore-missing-imports

  test:
    runs-on: ubuntu-latest
    needs: lint
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r api/requirements.txt -r indexer/requirements.txt pytest
      - run: cd api && pytest -v
      - run: cd indexer && pytest -v

  build:
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t rahbar-api:${{ github.sha }} -f api/Dockerfile api/
      - run: docker build -t rahbar-indexer:${{ github.sha }} -f indexer/Dockerfile indexer/
      - run: docker build -t rahbar-ui:${{ github.sha }} ui/

  scan:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t rahbar-api:${{ github.sha }} -f api/Dockerfile api/
      - name: Trivy scan API
        uses: aquasecurity/trivy-action@v0.33.1
        with:
          version: v0.76.2
          image-ref: rahbar-api:${{ github.sha }}
          severity: CRITICAL,HIGH
          exit-code: "0"

  kubeconform:
    runs-on: ubuntu-latest
    needs: lint
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Install kubeconform
        run: |
          curl -sL --retry 5 --retry-delay 10 --retry-all-errors https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz | tar xz
          sudo mv kubeconform /usr/local/bin/
      - run: kubectl kustomize k8s/overlays/dev/ | kubeconform -strict -summary

  e2e:
    runs-on: ubuntu-latest
    needs: [build, kubeconform]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Create kind cluster
        uses: helm/kind-action@v1.10.0
        with:
          cluster_name: kind
      # The eval gate needs real retrieval, which needs real embeddings. OLLAMA_URL's
      # default (host.minikube.internal) only resolves on minikube, and nothing in this
      # job ever ran a real embedding model before, so recall/abstention were untestable
      # and the gate below was `|| true`-ed into silence. Run Ollama as a plain container
      # on kind's own docker network (always named "kind", independent of cluster_name) so
      # pods inside the cluster can reach it by IP - the standard way to give a kind
      # cluster access to something outside it.
      - name: Start Ollama for real embeddings
        run: |
          docker run -d --name ollama --network kind -p 11434:11434 ollama/ollama:0.40.15
          for i in $(seq 1 30); do
            curl -sf http://localhost:11434/api/tags >/dev/null 2>&1 && break
            sleep 2
          done
          docker exec ollama ollama pull nomic-embed-text
          echo "OLLAMA_IP=$(docker inspect -f '{{.NetworkSettings.Networks.kind.IPAddress}}' ollama)" >> "$GITHUB_ENV"
      - name: Build and load images
        run: |
          docker build -t rahbar-api:${{ github.sha }} -f api/Dockerfile api/
          docker build -t rahbar-indexer:${{ github.sha }} -f indexer/Dockerfile indexer/
          docker build -t rahbar-ui:${{ github.sha }} ui/
          kind load docker-image rahbar-api:${{ github.sha }} rahbar-indexer:${{ github.sha }} rahbar-ui:${{ github.sha }}
      - name: Deploy to kind
        run: |
          kubectl kustomize k8s/overlays/dev/ | sed "s|rahbar-api:dev|rahbar-api:${{ github.sha }}|g; s|rahbar-indexer:dev|rahbar-indexer:${{ github.sha }}|g; s|rahbar-ui:dev|rahbar-ui:${{ github.sha }}|g" | kubectl apply -f -
          kubectl create secret generic rahbar-secret -n rahbar --from-literal=LLM_API_KEY=unused --dry-run=client -o yaml | kubectl apply -f -
          # The indexer writes to Chroma as soon as it starts; nothing upstream ever
          # waited for the chroma-0 pod to actually be accepting connections first, so
          # the indexer Job could (and did) race chroma's own startup and see
          # "Connection refused" on chroma:8000 before Chroma had finished coming up.
          kubectl wait --for=condition=ready pod -l app=chroma -n rahbar --timeout=120s
      - name: Switch to real retrieval for this run
        run: |
          kubectl patch configmap rahbar-config -n rahbar --type merge -p \
            "{\"data\":{\"RETRIEVER\":\"chroma\",\"EMBED_MODEL\":\"nomic-embed-text\",\"OLLAMA_URL\":\"http://${OLLAMA_IP}:11434\"}}"
          kubectl rollout restart deployment/api -n rahbar
      - name: Run indexer against the fixture corpus
        run: |
          kubectl create configmap fixture-corpus -n rahbar --from-file=eval/fixtures --dry-run=client -o yaml | kubectl apply -f -
          cat <<'EOF' | kubectl apply -f -
          apiVersion: batch/v1
          kind: Job
          metadata:
            name: indexer-e2e
            namespace: rahbar
          spec:
            backoffLimit: 1
            template:
              metadata:
                labels:
                  app: indexer
              spec:
                restartPolicy: Never
                automountServiceAccountToken: false
                securityContext:
                  runAsNonRoot: true
                  runAsUser: 1000
                containers:
                  - name: indexer
                    image: rahbar-indexer:${{ github.sha }}
                    imagePullPolicy: IfNotPresent
                    envFrom:
                      - configMapRef:
                          name: rahbar-config
                    securityContext:
                      allowPrivilegeEscalation: false
                      readOnlyRootFilesystem: true
                      capabilities:
                        drop: ["ALL"]
                    volumeMounts:
                      - {name: tmp, mountPath: /tmp}
                      - {name: corpus, mountPath: /corpus, readOnly: true}
                volumes:
                  - {name: tmp, emptyDir: {}}
                  - {name: corpus, configMap: {name: fixture-corpus}}
          EOF
          if ! kubectl wait --for=condition=complete job/indexer-e2e -n rahbar --timeout=180s; then
            echo "::group::Diagnostics: indexer-e2e did not complete"
            kubectl get pods -n rahbar -o wide
            kubectl describe job/indexer-e2e -n rahbar
            kubectl logs -n rahbar -l job-name=indexer-e2e --all-containers --prefix --tail=-1 || true
            echo "--- chroma logs ---"
            kubectl logs -n rahbar -l app=chroma --tail=-1 || true
            echo "::endgroup::"
            exit 1
          fi
      - name: Wait for API readiness against the real index
        run: kubectl wait --for=condition=available deployment/api -n rahbar --timeout=180s
      - name: Run eval
        run: |
          pip install httpx pyyaml
          API_URL=$(kubectl get svc api -n rahbar -o jsonpath='{.spec.clusterIP}')
          python eval/run_eval.py --api http://$API_URL --golden eval/fixtures/golden.fixture.yaml
