name: CD

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r api/requirements.txt -r indexer/requirements.txt pytest
      - run: cd api && pytest -v
      - run: cd indexer && pytest -v

  scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t rahbar-api:${{ github.sha }} -f api/Dockerfile api/
      - name: Trivy scan
        uses: aquasecurity/trivy-action@v0.33.1
        with:
          version: v0.76.2
          image-ref: rahbar-api:${{ github.sha }}
          severity: CRITICAL,HIGH
          exit-code: "0"

  kubeconform:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Install kubeconform
        run: |
          curl -sL --retry 5 --retry-delay 10 --retry-all-errors https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz | tar xz
          sudo mv kubeconform /usr/local/bin/
      - run: kubectl kustomize k8s/overlays/prod/ | kubeconform -strict -summary

  push:
    runs-on: ubuntu-latest
    needs: [test, scan, kubeconform]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and push images
        run: |
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/rahbar-api:${{ github.sha }} -f api/Dockerfile api/
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/rahbar-indexer:${{ github.sha }} -f indexer/Dockerfile indexer/
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/rahbar-ui:${{ github.sha }} ui/
          docker tag ${{ secrets.DOCKERHUB_USERNAME }}/rahbar-api:${{ github.sha }} ${{ secrets.DOCKERHUB_USERNAME }}/rahbar-api:latest
          docker tag ${{ secrets.DOCKERHUB_USERNAME }}/rahbar-indexer:${{ github.sha }} ${{ secrets.DOCKERHUB_USERNAME }}/rahbar-indexer:latest
          docker tag ${{ secrets.DOCKERHUB_USERNAME }}/rahbar-ui:${{ github.sha }} ${{ secrets.DOCKERHUB_USERNAME }}/rahbar-ui:latest
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/rahbar-api:${{ github.sha }}
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/rahbar-api:latest
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/rahbar-indexer:${{ github.sha }}
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/rahbar-indexer:latest
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/rahbar-ui:${{ github.sha }}
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/rahbar-ui:latest

  deploy:
    runs-on: ubuntu-latest
    needs: push
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      # This student project has no persistent, internet-reachable production
      # cluster for a cloud runner to reach - `kubectl apply` with no cluster
      # context just fails dialing localhost:8080. An ephemeral kind cluster,
      # deploying the images just pushed to Docker Hub by their real tag, is the
      # honest stand-in: it proves the images that were just published actually
      # roll out and come up healthy, not a fabricated "it's running somewhere".
      - name: Create kind cluster
        uses: helm/kind-action@v1.10.0
        with:
          cluster_name: kind
      - name: Deploy the published images to kind
        run: |
          kubectl kustomize k8s/overlays/prod/ | sed \
            "s|rahbar-api:dev|${{ secrets.DOCKERHUB_USERNAME }}/rahbar-api:${{ github.sha }}|g; \
             s|rahbar-indexer:dev|${{ secrets.DOCKERHUB_USERNAME }}/rahbar-indexer:${{ github.sha }}|g; \
             s|rahbar-ui:dev|${{ secrets.DOCKERHUB_USERNAME }}/rahbar-ui:${{ github.sha }}|g" \
            | kubectl apply -f -
          kubectl create secret generic rahbar-secret -n rahbar --from-literal=LLM_API_KEY=unused --dry-run=client -o yaml | kubectl apply -f -
          # 3 api replicas + chroma + redis starve a single shared runner node, so run
          # 1 replica here (the 3-replica topology is evidenced from the real cluster
          # in docs/evidence/). The HPA must go first: its minReplicas: 3 re-scaled
          # the Deployment straight back to 3 the moment it was scaled down. No
          # rollout wait yet - with RETRIEVER=chroma, /readyz is 503 until the
          # indexer below has written a non-empty collection.
          kubectl delete hpa api-hpa -n rahbar
          kubectl scale deployment/api -n rahbar --replicas=1
          kubectl wait --for=condition=ready pod -l app=chroma -n rahbar --timeout=120s
      - name: Run the indexer (dummy mode, matching the documented week-1 bootstrap)
        run: |
          # /readyz needs a non-empty collection whose pinned embed_model matches the
          # API's. The prod ConfigMap is pinned to nomic-embed-text for real traffic,
          # but this job never runs a real embedding model - so, exactly as the
          # project's own week-1 bootstrap procedure documents, pin EMBED_MODEL to
          # dummy-768 for this smoke test and let the Job's default --dummy args write
          # 3 fake chunks under that same pin. This is the intended way to prove the
          # Job -> StatefulSet -> Service -> probes -> Ingress chain without a model.
          kubectl patch configmap rahbar-config -n rahbar --type merge -p '{"data":{"EMBED_MODEL":"dummy-768"}}'
          kubectl delete job indexer-initial -n rahbar --ignore-not-found
          # Re-apply only the Job: re-applying everything would restore replicas: 3
          # and the HPA removed above.
          kubectl kustomize k8s/overlays/prod/ \
            | yq 'select(.kind == "Job")' \
            | sed "s|rahbar-indexer:dev|${{ secrets.DOCKERHUB_USERNAME }}/rahbar-indexer:${{ github.sha }}|g" \
            | kubectl apply -f -
          if ! kubectl wait --for=condition=complete job/indexer-initial -n rahbar --timeout=120s; then
            echo "::group::Diagnostics: indexer-initial did not complete"
            kubectl get pods -n rahbar -o wide
            kubectl describe job/indexer-initial -n rahbar
            kubectl logs -n rahbar -l job-name=indexer-initial --all-containers --prefix --tail=-1 || true
            echo "::endgroup::"
            exit 1
          fi
      - name: Roll out api and ui, now that the index exists
        run: |
          kubectl rollout restart deployment/api -n rahbar
          if ! kubectl rollout status deployment/api -n rahbar --timeout=180s; then
            echo "::group::Diagnostics: api rollout did not finish"
            kubectl get pods -n rahbar -o wide
            kubectl describe deployment/api -n rahbar
            kubectl logs -n rahbar -l app=api --all-containers --prefix --tail=-1 || true
            echo "::endgroup::"
            exit 1
          fi
          kubectl rollout status deployment/ui -n rahbar --timeout=180s
      - name: Smoke test through the Service
        run: |
          kubectl port-forward svc/api 8080:80 -n rahbar >/tmp/port-forward.log 2>&1 &
          for i in $(seq 1 15); do
            curl -sf http://localhost:8080/healthz >/dev/null 2>&1 && break
            sleep 1
          done
          curl -sf http://localhost:8080/healthz
          echo ""
          curl -sf http://localhost:8080/readyz
